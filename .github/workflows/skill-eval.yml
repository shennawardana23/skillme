name: Skill Eval

on:
  pull_request:
    paths:
      - "skills/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  discover:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: list
        name: List skills with an evals.json
        run: |
          set -euo pipefail
          skills_json=$(find skills -mindepth 1 -maxdepth 1 -type d -print0 \
            | while IFS= read -r -d '' dir; do
                if [ -f "$dir/evals/evals.json" ]; then
                  basename "$dir"
                fi
              done | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "skills=$skills_json" >> "$GITHUB_OUTPUT"

  eval:
    needs: [test, discover]
    if: needs.discover.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.233

      - name: Build smeval
        run: go build -o smeval ./cmd/smeval

      - name: Validate spec compliance (${{ matrix.skill }})
        run: uvx --from skills-ref agentskills validate "skills/${{ matrix.skill }}"

      - name: Validate ${{ matrix.skill }}
        run: ./smeval validate "skills/${{ matrix.skill }}"

      - name: Evaluate ${{ matrix.skill }}
        run: ./smeval run "skills/${{ matrix.skill }}" -output-dir "smeval-workspace/${{ matrix.skill }}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smeval-report-${{ matrix.skill }}
          path: smeval-workspace/${{ matrix.skill }}/**
          if-no-files-found: ignore
