name: Skill Eval

on:
  pull_request:
    paths:
      - "skills/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  discover:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: list
        name: List skills with an evals.json
        run: |
          set -euo pipefail
          skills_json=$(find skills -mindepth 1 -maxdepth 1 -type d -print0 \
            | while IFS= read -r -d '' dir; do
                if [ -f "$dir/evals/evals.json" ]; then
                  basename "$dir"
                fi
              done | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "skills=$skills_json" >> "$GITHUB_OUTPUT"

  # Schema/spec validation only — no model calls, no API key needed.
  # This intentionally does NOT run `smeval run` (which calls a live model):
  # at catalog scale, re-running every skill's live eval on every push would
  # mean real API cost and ~30+ minutes of matrix time for a one-line change
  # to a single skill. `smeval run` stays a local/manual step — see the
  # Contributing section in README.md — required before opening a PR, not
  # a CI gate.
  validate:
    needs: [test, discover]
    if: needs.discover.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build smeval
        run: go build -o smeval ./cmd/smeval

      - name: Validate spec compliance (${{ matrix.skill }})
        run: uvx --from skills-ref agentskills validate "skills/${{ matrix.skill }}"

      - name: Validate ${{ matrix.skill }}
        run: ./smeval validate "skills/${{ matrix.skill }}"
